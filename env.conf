###############################################################
#  UpinelAIOS-GGUF  -  user configuration
#
#  Upinel's One-Click AI Agent Server OS for Mac (GGUF).
#
#  This is the ONLY file you need to edit.
#  Every setting has a working default for a 64 GB Apple Silicon Mac.
#  Apply changes with ./restart.sh
###############################################################

# ─────────────────────────────────────────────────────────────
# 1. MODEL
# ─────────────────────────────────────────────────────────────
# Gemma 4, UNCENSORED ONLY. Every entry below is an uncensored fine-tune of
# Gemma 4. UpinelAIOS-GGUF does not ship or suggest aligned models - the point of
# running this locally is to have a model that does not refuse you.
#
#   alias       size    notes
#   ---------   ------  ----------------------------------------------------
#   26b-q4      15 GB   DEFAULT. MoE, ~4B active. Q4_0, so ~22% faster than
#                       26b-a4b below. Vision. Heretic/ARA decensored, built
#                       on Google's quantization-aware-trained Q4_0.
#   26b-a4b     17 GB   The same MoE in Q4_K_M. Kept for comparison; slower,
#                       bigger, same architecture. Vision. HauhauCS Balanced.
#   12b          8 GB   Dense 12B. Vision. HauhauCS Balanced.
#   31b-heretic 18 GB   Dense 31B, abliterated. Highest quality, slowest.
#   e2b          4 GB   Smallest. Fits an 8 GB Mac at 4.1 GB on disk.
#   e4b          6 GB   Middle size. Measured SLOWER than both the 26B MoE and
#                       the E2B, so there is little reason to pick it.
#
# Why Q4_0 leads, measured on this machine with MTP depth 3, identical prompts,
# median of five:
#
#   quant     size      decode
#   -------   -------   --------
#   Q4_K_M    16.80 GB    72.5 t/s
#   Q4_0 QAT  14.25 GB   106.4 t/s
#
# llama.cpp's Metal kernels run Q4_0 markedly faster than K-quants - the same
# effect appears on any model - and QAT is what makes Q4_0 safe here, because a
# naive post-hoc Q4_0 costs real accuracy while this one does not.
#
# All are GGUF and served by llama.cpp, because that is the only runtime that
# can serve uncensored Gemma 4 at speed: MTPLX requires a target/assistant pair
# and the only such pair is built from Google's aligned models.
#
# Measured on an M5 Pro, 256 tokens generated.
#
#   alias      file     RAM used   decode    prefill   TTFT
#   --------   ------   --------   -------   -------   -----
#   26b-q4     14.25 GB   ~19 GB   106.4 t/s    98 t/s  1.1 s   DEFAULT
#   e2b         3.4 GB    4.2 GB    99.9 t/s   294 t/s  1.7 s
#   26b-a4b    16.80 GB  ~20.5 GB   72.5 t/s   271 t/s  2.8 s
#   e4b         5.3 GB    6.8 GB    63.9 t/s    84 t/s  0.4 s
#   12b         7.4 GB    ~10 GB    54.5 t/s    81 t/s  2.6 s
#   qwen-9b       --        --      44.3 t/s   130 t/s  4.1 s
#   qwen-27b      --        --      13.5 t/s   133 t/s  9.1 s
#
# 26b-q4 is both the default and the fastest thing here. e2b is the pick for
# small Macs or when you want the quickest possible first token.
#
# Which quantization to download. GGUF repos often publish every quant of the
# same model - the 31B heretic repo carries ten of them, 232 GB in total, of
# which 18.7 GB is the one a Mac wants. UpinelAIOS-GGUF downloads only this one
# and skips the rest.
#
#   Q4_K_M   the sweet spot: near-Q8 quality at a quarter of the size. DEFAULT.
#   Q4_K_S   slightly smaller, slightly worse. For a tight memory budget.
#   Q5_K_M   better than Q4_K_M, ~17% bigger. 64 GB Macs can afford it.
#   Q6_K     near-lossless, clearly bigger. Diminishing returns for agents.
#   Q3_K_M   last resort on a small Mac; noticeable quality loss.
#   BF16     the unquantized original. Enormous, and no faster.
#
# If the model you pick does not publish this quant, the closest one down the
# quality ladder is used automatically. The projector and MTP draft head are
# always fetched, whatever the quant - they are separate artifacts, and MTP is
# where the speed comes from.
#
# Q4_0, not Q4_K_M, because it matches the default MODEL above: that release is
# Google's quantization-aware-trained Q4_0, which is a different and better
# artifact than a naive Q4_0, not a cheaper Q4_K_M. Shipping Q4_K_M here made
# every fresh install print a substitution warning about the model it had just
# chosen for you. Switch this if you move to a model that publishes K-quants.
MODEL_QUANT="Q4_0"

# Managing models:
#   ./model_download.sh              list what is available and what you have
#   ./model_download.sh 12b          download one
#   ./model_download.sh --switch 12b download if needed, switch, and restart
#   ./start.sh --model 12b           serve a different model for one run
MODEL="OS-Software/gemma-4-26B-A4B-it-qat-q4_0-heretic-ja-GGUF"

# Where model weights live. Kept out of git (see .gitignore).
MODELS_DIR="$REPO_DIR/models"

# ─────────────────────────────────────────────────────────────
# 2. CONTEXT
# ─────────────────────────────────────────────────────────────
# llama.cpp allocates the KV cache up front for the whole window, so unlike a
# paged runtime this is a real reservation: a bigger number costs memory even
# when unused. Budget roughly:
#
#     ctx        KV at q8_0 (26b-a4b)
#     -------    ---------------------
#      32768      ~0.5 GB
#     131072      ~2.0 GB
#     262144      ~4.0 GB
#
# 128K is comfortable on 64 GB with the 17 GB model. Raise it on a bigger Mac.
CONTEXT_WINDOW=131072

# Hard ceiling on tokens generated per reply.
MAX_RESPONSE_TOKENS=32768

# KV cache quantization:  q8 | q4 | f16
#   f16   best quality, largest cache
#   q8    ~half the memory, negligible quality cost. DEFAULT.
#   q4    smallest; use only if you are short on memory.
#
# ONE VOCABULARY, TWO ENGINES. llama.cpp and MLX spell these differently, so
# this file says what the setting MEANS and the engine translates:
#
#     here   llama.cpp (GGUF)   MLX (MTPLX)
#     q8     q8_0               q8
#     q4     q4_0               q4
#     f16    f16                off   (MLX calls an unquantized cache "off")
#
# The older spellings (q8_0, q4_0) are still accepted, so an existing env.conf
# keeps working unchanged.
KV_QUANT="q8"

# ─────────────────────────────────────────────────────────────
# 3. THINKING
# ─────────────────────────────────────────────────────────────
# Each level is a real token budget on the thought channel, set with
# llama.cpp's --reasoning-budget, plus a message injected as the cap is hit.
#
# Measured on the DEFAULT 26B-A4B, eight agent tasks, greedy sampling - median
# completion tokens per turn and how many tool calls were correct:
#
#   setting            budget   tokens/turn   thinking   correct
#   -----------------  ------   -----------   --------   -------
#   off                   -          16           0       8/8
#   unlimited            -1          58          32       8/8
#   minimal        32          70          58       8/8
#   low           128          58          32       8/8
#   medium        512          58          32       8/8
#
# The 26B does not overthink on tool-calling work: it reasons for about 32
# tokens and then acts. A 32-token cap therefore does not bind, and the
# budget message costs more than it saves - 70 tokens against 58 uncapped.
# The 128 and 512 budgets never engage at all.
#
# So the levels are here for genuinely hard work, not for trimming routine
# turns. On routine turns they buy nothing: "off" is 16 tokens against 58.
#
# WARNING, and the reason this file now carries real numbers: an earlier
# version of this section was measured on the WRONG MODEL. The benchmark
# resolved its model by taking the first directory under models/, so once a
# second model was downloaded it silently benchmarked a 2B model while the
# docs described a 26B one - producing a very different table, including a
# claim that a small budget beat thinking-off. It does not. Both bench
# scripts now resolve the model through env.conf, the same path start.sh
# uses.
#
# Budgets are also sensitive to where the cut lands, so treat any single
# number as a measurement rather than a formula, and re-run
# ./bench/thinking-budget-test.py after changing model or task mix.
THINKING="low"

# Override the level's tuned budget. 0 = use the level's value.
THINKING_BUDGET_TOKENS=0

# Injected as the thinking budget runs out. Only useful when a budget actually
# binds; on this model's tool-calling workload it does not, and adding it to a
# small budget costs more tokens than it saves.
THINKING_BUDGET_MESSAGE="Stop reasoning now. Immediately call the single most appropriate tool with the correct arguments. Do not explain."

# ─────────────────────────────────────────────────────────────
# 4. SPEED
# ─────────────────────────────────────────────────────────────
# Gemma 4 ships a small companion "assistant" model that drafts tokens for the
# main model to verify. It is a real speedup here, unlike the MTP heads on the
# Qwen side. Depth is the number of tokens drafted per step:
#
#   n-max   short ctx   long ctx   notes
#   -----   ---------   --------   ------------------------------------
#     0      62 t/s      36 t/s    off (plain autoregressive)
#     1      65 t/s      39 t/s    what this used to default to
#     2      82 t/s      41 t/s    better than 1
#     3      82 t/s      47 t/s    DEFAULT - best or tied everywhere
#     4      80 t/s      44 t/s    no better than 3, more memory
#
# Measured against realistic code generation, interleaved A/B so thermal drift
# hit both sides equally. 3 wins at short context and ties at long, so there is
# no reason to run anything else.
#
# The old numbers here (depth 1 best at long context, "3 degrades badly past
# ~8k") came from a measurement that was never reproduced - at 8k, depth 3
# actually measures 48 t/s against depth 1's 46. If you re-tune, use
# `bench/sweep.py --ask code`: a trivially predictable prompt pins draft
# acceptance at 100% and flatters deep drafting.
#
# Long context is where agents live, so 3 is the default. MTP_DEPTH=0 disables
# speculative decoding entirely.
# Some MTP heads are built against a patched llama.cpp - HauhauCS's FastMTP
# for the Qwen 27B trims the drafter's vocabulary and adds a `d2t` remap
# tensor that stock llama.cpp rejects. llama-server treats a failed draft as
# fatal and exits rather than falling back, so the server detects these heads
# and runs autoregressive instead of refusing to boot.
#
# Set this to 1 ONLY if you have built llama.cpp with the matching patch.
# Docs and the build steps: docs/GGUF-RUNTIME.md
# Path to the llama-server binary. Empty means "whatever is on PATH", which
# is the Homebrew build and is right for almost everything.
#
# Point this at a patched build to use the Qwen 27B FastMTP draft. The patch
# only touches the Qwen35 architecture, so the patched build is a couple of
# percent SLOWER for Gemma - use it only while serving models that need it.
#     LLAMA_SERVER="/path/to/llama.cpp/build/bin/llama-server"
# Measured and explained in docs/GGUF-RUNTIME.md
LLAMA_SERVER=""

DRAFT_PATCHED_RUNTIME=0

MTP_DEPTH="auto"

# How many prompt tokens are ingested per pass. Smaller = lower peak memory,
# slightly slower prefill.
#
# "auto" picks the value each runtime is happiest with, and they are not the
# same number: llama.cpp runs 512, MTPLX 2048. Set a number only to override.
#
# NOTE: on the GGUF engine this is informational only. llama.cpp controls
# prefill chunking through -b / -ub, which are BATCH_SIZE and UBATCH_SIZE
# below; the value here is recorded and fingerprinted but not passed to
# llama-server. It is the MLX engine that acts on it.
PREFILL_CHUNK_TOKENS="auto"

# ─────────────────────────────────────────────────────────────
# 4c. MTPLX  (used only when the selected model is an MLX pack)
# ─────────────────────────────────────────────────────────────
# These are ignored entirely on the GGUF engine, and vice versa for the GGUF
# keys below. A model belongs to one engine, so only one block is ever live -
# but both are shown here so you can see what the other engine offers before
# deciding which model to run.

# MTPLX launch profile: turbo | sustained | stable | exact | performance-cold |
# max-diagnostic. "sustained" is the long-context path; turbo's prefill
# triggers a Metal OOM past ~32K.
PROFILE="sustained"

# Batching preset for concurrent clients: solo | latency | agent | throughput.
# "agent" is tuned for coding-agent traffic (few sessions, long shared prefixes,
# bursty).
BATCHING_PRESET="agent"

# Session/prefix bank in GB - the biggest allocator after the weights. MTPLX
# otherwise auto-sizes it to half the post-model surplus, ~16 GB on a 64 GB Mac,
# which is enough to push macOS into swap once a long KV cache is live.
# 0 = let MTPLX decide.
SESSION_BANK_GB=8

# MLX allocator cache ceiling in GB. 0 = MTPLX default.
MLX_CACHE_LIMIT_GB=0

# How MTPLX handles thinking across turns: auto | on | off | scoped.
# "scoped" keeps reasoning out of the replayed history, which is what you want
# for an agent loop.
PRESERVE_THINKING="scoped"

# End a capped reasoning run early once it stops producing novel content, rather
# than truncating it mid-thought.
THINKING_NOVELTY_CLOSE=1

# SSD-backed session cache: on | off | write-only.
SSD_SESSION_CACHE="off"

# How many tokens to accumulate before emitting an SSE chunk. 1 = smoothest
# token-by-token streaming; higher = less overhead.
STREAM_INTERVAL=1

# Request rate limit, in requests per minute. 0 = unlimited.
RATE_LIMIT=0

# Pre-warm the n-gram cache at startup. 0 = off.
NGRAM_PREWARM=0

# Batch sizes. 2048/512 is a good default on unified memory; lower them if you
# see "Insufficient Memory" during a long prefill.
BATCH_SIZE=2048
UBATCH_SIZE=512

# Simultaneous sequences (llama.cpp -np). 1 gives one client the whole machine
# and the lowest latency; raise it to serve several agents from one server.
MAX_CONCURRENT=4

# ─────────────────────────────────────────────────────────────
# 4b. M5 NEURAL ACCELERATORS (Metal 4 tensor API)
# ─────────────────────────────────────────────────────────────
# Apple M5 puts a Neural Accelerator in every GPU core, reachable through the
# Metal 4 tensor API. llama.cpp uses it where it can, and the win is concentrated
# in PREFILL - the part of a turn that ingests the prompt, which is exactly what
# a cold agent session waits on.
#
# Measured here, M5 Pro, 8,009-token prompt, cold first turn:
#
#     tensor API on    1,374 t/s prefill     5.83 s to first token
#     tensor API off     715 t/s prefill    11.20 s to first token
#
# ~1.9x on prefill; decode is unchanged (119 vs 115 t/s, within run-to-run
# noise). The win is real but it is a prefill win, not a decode one.
#
#   auto   Let llama.cpp decide. It turns the tensor API on for M5/M6/A19/A20
#          and leaves it off everywhere else. DEFAULT, and the right answer
#          unless you are specifically testing.
#   on     Force it on. Only meaningful on M5 or later - llama.cpp's own notes
#          record the tensor API as ~5% SLOWER on M2 Ultra and neutral on M4,
#          which is why it gates on chip name. start.sh warns if you force it
#          on older silicon.
#   off    Force it off, for A/B measurement or if a future driver regresses.
#
# M1-M4 have no neural accelerator, so this setting changes nothing there.
METAL_TENSOR_API="auto"

# ─────────────────────────────────────────────────────────────
# 5. MEMORY
# ─────────────────────────────────────────────────────────────
# Unified memory the server may use, in GB. 64 GB Mac: 48 leaves ~16 GB for
# macOS and your apps. 32 GB Mac: set 24 and CONTEXT_WINDOW=32768.
MEMORY_LIMIT_GB=48

# Pin the model in RAM so macOS cannot page it out. Recommended: it is the
# difference between a consistent 80 t/s and a stuttering one.
USE_MLOCK=1

# ─────────────────────────────────────────────────────────────
# 6. NETWORK  (LAN sharing)
# ─────────────────────────────────────────────────────────────
# 0.0.0.0 = reachable from every device on your LAN.
# 127.0.0.1 = this Mac only.
HOST="0.0.0.0"
PORT=8000

# Serving on a non-loopback address REQUIRES an API key - llama.cpp refuses to
# bind otherwise. A key is generated on first start if the file is missing.
# Clients send it as:  Authorization: Bearer <key>
API_KEY_FILE="$REPO_DIR/run/api-key"

# The name clients ask for in the "model" field of /v1/chat/completions.
SERVED_MODEL_NAME="Upinel-AIOS"

# Vision: Gemma 4 is multimodal. Set to 0 to skip loading the vision tower and
# save ~1 GB of memory.
ENABLE_VISION=0

# Context slots (parallel chats). llama.cpp splits CONTEXT_WINDOW across slots.
# Keep 1 for maximum context, or raise it for several concurrent chats.
PARALLEL_SLOTS=1

# ─────────────────────────────────────────────────────────────
# 7. THERMALS
# ─────────────────────────────────────────────────────────────
#   default  let macOS manage fans. Recommended.
#   smart    boost only while generating (needs a one-time sudo unlock).
#   max      fans pinned high while the server runs. Loud, best sustained clocks.
#
# A MacBook decoding for minutes at a time will throttle. If your throughput
# sags over a long run, this is the lever.
FAN_MODE="default"

# ─────────────────────────────────────────────────────────────
# 8. ADVANCED  - leave these alone unless you are experimenting
# ─────────────────────────────────────────────────────────────
# Cap on how much of the model macOS may wire. 0 = leave macOS alone.
WIRED_LIMIT_GB=0

# Rewrite the model's chat template so every tool call is told, by name, which
# fields are mandatory. Without this the model silently drops fields it judges
# optional, and agent harnesses fail with:
#     Error: invalid arguments: missing required property "file_path"
# Costs nothing at runtime and ~400 chars of system prompt. Leave on.
TOOL_TEMPLATE=1

# Startup warmup. 0 disables.
WARMUP_TOKENS=8

# Log file (rotated at 32 MB on each start).
LOG_FILE="$REPO_DIR/run/server.log"
